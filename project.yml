name: CastDeck
options:
  bundleIdPrefix: com.castdeck
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1,2"
  SWIFT_VERSION: "5.10"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  AndroidTVRemoteControl:
    url: https://github.com/odyshewroman/AndroidTVRemoteControl
    from: 2.0.0
targets:
  CastDeck:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
    resources:
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.castdeck.googletvremote
      PRODUCT_NAME: CastDeck
      INFOPLIST_FILE: App/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      GENERATE_INFOPLIST_FILE: false
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0.0"
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: AndroidTVRemoteControl
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CastDeck
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
