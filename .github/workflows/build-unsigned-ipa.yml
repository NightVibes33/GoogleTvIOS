name: Build unsigned iOS 27 IPA

on:
  push:
    branches:
      - codex/unsigned-ios-27-ipa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and iOS 27 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | tee /tmp/sdks.txt
          grep -Eq 'iphoneos27([.]|$)' /tmp/sdks.txt
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CastDeck.xcodeproj -scheme CastDeck
      - name: Build unsigned device app
        run: xcodebuild -project CastDeck.xcodeproj -scheme CastDeck -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          /usr/bin/zip -qry CastDeck-iOS-27-unsigned.ipa Payload
          unzip -l CastDeck-iOS-27-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CastDeck-iOS-27-unsigned-IPA
          path: CastDeck-iOS-27-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Build for iOS 27 simulator
        run: xcodebuild -project CastDeck.xcodeproj -scheme CastDeck -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - name: Boot simulator, launch app, and capture screenshot
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime, group in data["devices"].items() if "iOS-27" in runtime for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          APP_PATH="$(find build-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.castdeck.googletvremote
          sleep 3
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/CastDeck-iOS-27-simulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: CastDeck-iOS-27-simulator-screenshot
          path: screenshots/CastDeck-iOS-27-simulator.png
          if-no-files-found: error
          retention-days: 30


